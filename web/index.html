<!DOCTYPE html>
<html lang="de">
<head>
  <!-- Replaced by `flutter build web --base-href`, e.g. /instantShare/ on GitHub Pages. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Dateien und Text per animierten QR-Codes teilen – ohne Netzwerk, ohne Server. Läuft komplett im Browser.">
  <meta name="theme-color" content="#0B6BCB">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="InstantShare">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>InstantShare</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #10131a; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      font-family: system-ui, sans-serif; color: #dfe2eb;
    }
    #splash img { width: 96px; height: 96px; border-radius: 28px; }
    #splash .bar { width: 160px; height: 4px; border-radius: 2px; background: #2b3140; overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 2px;
      background: #a8c8ff; animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
  </div>
  <!-- QR decoding for the camera: zxing-cpp as WebAssembly, served from this site. -->
  <script src="zxing/zxing_reader.js"></script>
  <script src="qr_scanner.js"></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) splash.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
